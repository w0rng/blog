{{ define "main" }}
<section class="home">
  <h1>{{ .Site.Title }}</h1>

  {{ .Content }}

  <ul class="posts">
    {{- range .Site.RegularPages }}
    <li>
      <time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{- end }}
  </ul>

  <p class="meta"><a href="/index.xml">RSS</a></p>
</section>
{{ end }}
