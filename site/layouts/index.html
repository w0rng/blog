{{ define "main" }}
<h1>{{ .Site.Title }}</h1>

{{ .Content }}

<ul class="posts">
  {{- range .Site.RegularPages }}
  <li>
    <span class="date">{{ .Date.Format "02.01.2006" }}</span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{- end }}
</ul>

<p class="meta"><a href="/index.xml">RSS</a></p>
{{ end }}
