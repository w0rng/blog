{{ define "main" }}
<nav class="back"><a href="/">← Главная</a></nav>

<article>
  <h1 class="title">{{ .Title }}</h1>
  <p class="meta">{{ .Date.Format "2 января 2006" }}</p>

  {{- if .Params.toc }}
  <nav class="toc">{{ .TableOfContents }}</nav>
  {{- end }}

  {{ .Content }}

  {{- with .GetTerms "tags" }}
  <div class="tags">
    {{- range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
  </div>
  {{- end }}
  <p>⚆ <span data-goatcounter-visit-count></span></p>
</article>

<script>
  fetch('https://w0rng.goatcounter.com/counter/' + encodeURIComponent(location.pathname) + '.json')
    .then(r => r.json())
    .then(data => {
      document.querySelector('[data-goatcounter-visit-count]').textContent = data.count;
    });
</script>

<script src="https://giscus.app/client.js"
        data-repo="w0rng/blog"
        data-repo-id="R_kgDOOFG1_w"
        data-category="Announcements"
        data-category-id="DIC_kwDOOFG1_84C1Ghf"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="ru"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>

{{ end }}
