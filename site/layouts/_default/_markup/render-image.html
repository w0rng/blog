{{- $path := strings.TrimPrefix "/" .Destination -}}
{{- with resources.Get $path -}}
  {{- $large := .Resize (printf "%dx webp q75" .Width) -}}
  {{- if gt .Width 480 -}}
    {{- $small := .Resize "480x webp q75" -}}
<img src="{{ $large.RelPermalink }}"
     srcset="{{ $small.RelPermalink }} 480w, {{ $large.RelPermalink }} {{ .Width }}w"
     sizes="(max-width: 32rem) calc(100vw - 2rem), {{ .Width }}px"
     width="{{ .Width }}" height="{{ .Height }}"
     loading="lazy" decoding="async"
     alt="{{ $.Text }}"{{ with $.Title }} title="{{ . }}"{{ end }}>
  {{- else -}}
<img src="{{ $large.RelPermalink }}"
     width="{{ .Width }}" height="{{ .Height }}"
     loading="lazy" decoding="async"
     alt="{{ $.Text }}"{{ with $.Title }} title="{{ . }}"{{ end }}>
  {{- end -}}
{{- else -}}
<img src="{{ .Destination | safeURL }}"
     loading="lazy" decoding="async"
     alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
