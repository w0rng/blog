baseURL = 'https://abramov.blog/'
languageCode = 'ru-ru'
title = 'Abramov blog'
disableKinds = ['taxonomy', 'sitemap',]
enableRobotsTXT = true

[module]
[module.hugoVersion]
extended = true
min = "0.41.0"

[markup]
[markup.goldmark]
[markup.goldmark.parser]
[markup.goldmark.parser.attribute]
block = true
title = true

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = true
hl_Lines = ''
hl_inline = false
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = true
noHl = false
style = 'monokai'
tabWidth = 4

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[params]
[params.theme_config]
date_format = "2006-01-02"
isListGroupByDate = false
