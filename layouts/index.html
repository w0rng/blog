{{ define "main" }}
<h1>{{ .Site.Title }}</h1>

{{ .Content }}

<ul class="posts">
  {{- range first 10 (where .Site.RegularPages "Section" "posts") }}
  <li>
    <span class="date">{{ .Date.Format "02.01.2006" }}</span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{- end }}
</ul>

<p><a href="/posts/">Все записи</a></p>
{{ end }}
