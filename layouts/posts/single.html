{{ define "main" }}

<article>
    <h1 class="title">{{ .Title }}</h1>

    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }} class="toc" {{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    {{ .Content }}
</article>
<!--{{ partial "footer.html" }}-->
{{ end }}
